name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The retirement check below diffs against a base commit, which the
          # default depth-1 clone does not have. Without this it fails with
          # "bad object" on every run rather than skipping.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # tsc -b covers src, which includes the test files, so a test that
      # references a renamed field fails here rather than at run time.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The one that matters. src/data/ and supabase/seed.sql are generated,
      # and once went four commits out of step with the script that writes
      # them, because a generated file was edited by hand. Building proves
      # nothing about that: the tree compiled fine the whole time. Only
      # regenerating and diffing catches it.
      - name: Generated files are what the extractor writes
        run: |
          npm run extract
          git diff --exit-code -- src/data supabase/seed.sql

      # A migration that deletes places must be accompanied by a re-seed, or
      # the deletions land without the replacements. That gap left the live
      # database 21 places short. CI cannot reach the database, but it can
      # notice the commit that sets it up.
      - name: A retirement migration comes with a seed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Missing, all zeros on a new branch, or present but unreachable
          # after a force push. All three mean there is nothing to compare to.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'No base commit to compare against, skipping.'
            exit 0
          fi
          retires=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            if grep -Eqi 'delete[[:space:]]+from[[:space:]]+("?public"?\.)?"?places"?' "$f"; then
              retires=1
              echo "retires places: $f"
            fi
          done <<< "$(git diff --name-only "$BASE" HEAD -- supabase/migrations)"

          if [ "$retires" = "1" ] && [ -z "$(git diff --name-only "$BASE" HEAD -- supabase/seed.sql)" ]; then
            echo 'A migration here deletes places but supabase/seed.sql is unchanged.'
            echo 'The deletions would land without the replacements. See the order in README.md.'
            exit 1
          fi
          echo ok
