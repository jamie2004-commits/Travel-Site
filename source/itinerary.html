<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangzhou and Shanghai Trip Planner</title>
<style>
:root{
  --ink:#16211e;
  --ink-soft:#5c6a61;
  --ink-faint:#8b978d;
  --paper:#eef1ea;
  --card:#ffffff;
  --line:#dae0d5;
  --line-soft:#e8ece4;
  --tea:#2f6b4f;
  --tea-soft:#eaf1eb;
  --lacquer:#b4392c;
  --lacquer-soft:#f8ebe8;
  --gold:#9a7526;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tea);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#f7f9f4,var(--paper));
  padding:22px 24px 16px;
}
.masthead-in{max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.brand h1{
  font-family:var(--serif);
  font-size:34px;line-height:1.1;margin:0;letter-spacing:.02em;font-weight:600;
}
.brand h1 .sep{color:var(--tea);padding:0 6px}
.brand .sub{
  margin-top:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);
}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 13px;font-size:13.5px;color:var(--ink);transition:.15s;
}
.btn:hover{border-color:var(--tea);color:var(--tea)}
.btn-solid{background:var(--tea);border-color:var(--tea);color:#fff}
.btn-solid:hover{background:#265a41;color:#fff}
.btn-quiet{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 8px}
.btn-quiet:hover{color:var(--lacquer)}

/* ---------- layout ---------- */
.shell{max-width:1440px;margin:0 auto;padding:20px 24px 80px;display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:26px;align-items:start}
@media(max-width:1080px){.shell{grid-template-columns:minmax(0,1fr)}}

/* ---------- day rail ---------- */
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;scrollbar-width:thin}
.rail button{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 11px;text-align:left;line-height:1.25;
}
.rail button b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.rail button span{display:block;font-family:var(--serif);font-size:13px;color:var(--ink-soft)}
.rail button:hover{border-color:var(--tea)}
.rail button.wed{border-color:#e4bdb7}
.rail button.wed b{color:var(--lacquer)}

/* ---------- day card ---------- */
.day{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:18px;overflow:hidden;
}
.day.drop{border-color:var(--tea);box-shadow:0 0 0 3px var(--tea-soft)}
.day-head{display:flex;gap:16px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line-soft)}
.date-block{flex:0 0 auto;text-align:center;min-width:58px}
.date-block .dm{font-family:var(--serif);font-size:26px;line-height:1;font-weight:600;letter-spacing:.01em}
.date-block .mo{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-faint);margin-top:5px}
.day.wedding .date-block .dm{color:var(--lacquer)}
.day-titles{flex:1;min-width:0}
.day-titles .cn{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.3;letter-spacing:.01em}
.day-titles input{
  width:100%;border:0;background:transparent;padding:2px 0;font-size:13.5px;color:var(--ink-soft);
}
.day-titles input::placeholder{color:var(--ink-faint)}
.day-titles input:focus{background:var(--tea-soft);border-radius:5px;padding:2px 5px}
.day-tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--ink-faint);white-space:nowrap;
}
.day.wedding .day-tag{border-color:#e4bdb7;color:var(--lacquer);background:var(--lacquer-soft)}

/* ---------- items ---------- */
.items{padding:6px 18px 4px;position:relative}
.empty{padding:20px 4px 22px;color:var(--ink-faint);font-size:13.5px;border-left:1px dashed var(--line);margin-left:64px;padding-left:18px}
.item{
  display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;
  padding:12px 0;border-bottom:1px dashed var(--line-soft);position:relative;
}
.item:last-child{border-bottom:0}
.item.dragging{opacity:.35}
.item.over-top::before,.item.over-bot::after{
  content:"";position:absolute;left:0;right:0;height:2px;background:var(--tea);
}
.item.over-top::before{top:-1px}
.item.over-bot::after{bottom:-1px}
.time-col{position:relative;padding-top:1px}
.time-col input{
  width:58px;border:1px solid transparent;border-radius:6px;background:var(--line-soft);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;padding:3px 6px;text-align:center;
}
.time-col input:hover{border-color:var(--line)}
.time-col input:focus{background:#fff;border-color:var(--tea)}
.body-col{min-width:0}
.title-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.title-line .cn{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.35;letter-spacing:.01em}
.title-line .en{font-size:13.5px;color:var(--ink-soft)}
.title-line input{
  border:1px solid transparent;background:transparent;border-radius:6px;padding:1px 4px;margin:-1px -4px;
  font-family:var(--serif);font-size:17.5px;font-weight:600;width:100%;
}
.title-line input:focus{background:var(--tea-soft);border-color:var(--tea)}
.meta{margin-top:3px;font-size:12.5px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta .cost{font-family:var(--mono);font-size:11.5px;color:var(--tea)}
.note{
  width:100%;margin-top:7px;border:1px solid var(--line-soft);border-radius:8px;background:#fbfcfa;
  padding:7px 9px;font-size:13px;resize:none;overflow:hidden;color:var(--ink-soft);min-height:34px;
}
.note:focus{border-color:var(--tea);background:#fff;color:var(--ink)}
.note::placeholder{color:#a9b3aa}
.fields{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.fields input{
  border:1px solid var(--line-soft);background:#fbfcfa;border-radius:7px;padding:5px 8px;
  font-family:var(--mono);font-size:12px;width:130px;
}
.fields input:focus{border-color:var(--tea);background:#fff}
.act-col{display:flex;gap:2px;align-items:center}
.iconbtn{
  border:0;background:transparent;color:var(--ink-faint);padding:4px 5px;border-radius:6px;line-height:1;font-size:14px;
}
.iconbtn:hover{background:var(--line-soft);color:var(--ink)}
.iconbtn.del:hover{background:var(--lacquer-soft);color:var(--lacquer)}
.grip{cursor:grab;color:#b7c0b8;font-size:15px;padding:4px 3px}
.grip:active{cursor:grabbing}
.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-faint);white-space:nowrap;
}
.chip.flight{border-color:#c9d6e4;color:#3d6183;background:#eef4fa}
.chip.hotel{border-color:#e0d3b5;color:var(--gold);background:#faf5e9}
.chip.food{border-color:#e6cfc2;color:#a5643a;background:#fbf2ec}
.chip.sight{border-color:#c6dbc9;color:var(--tea);background:var(--tea-soft)}
.chip.fun{border-color:#d5cbe4;color:#6a4f96;background:#f4f0fa}
.chip.night{border-color:#c3cddd;color:#3f5375;background:#eff2f8}

/* ---------- tonight's stay ---------- */
.stay{
  display:flex;gap:14px;align-items:flex-start;padding:12px 18px;
  background:#faf6ec;border-top:1px solid #efe4cd;
}
.day.wedding .stay{background:#fbf3f1;border-top-color:#eed7d2}
.stay-label{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);padding-top:8px;white-space:nowrap;min-width:52px;
}
.day.wedding .stay-label{color:var(--lacquer)}
.stay-fields{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.stay-fields input{
  border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 8px;
  font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex:1 1 210px;min-width:0;
}
.stay-fields input:hover{border-color:#e7dcc4}
.stay-fields input:focus{background:#fff;border-color:var(--gold);color:var(--ink)}
.stay-fields input::placeholder{color:#b6a882}
.stay-fields .stay-name{
  flex-basis:100%;font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:.01em;color:var(--ink);
}
.stay-fields .stay-name::placeholder{font-family:var(--sans);font-size:14px;font-weight:400}

.day-foot{display:flex;flex-wrap:wrap;gap:7px;padding:11px 18px 15px;border-top:1px solid var(--line-soft);background:#fbfcfa}
.day-foot .btn{padding:6px 11px;font-size:12.5px;background:#fff}

/* ---------- library ---------- */
.lib{position:sticky;top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
@media(max-width:1080px){.lib{position:static;max-height:none}}
.lib-head{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.lib-head h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;font-weight:600}
.lib-head p{margin:0;font-size:12.5px;color:var(--ink-faint)}
.lib-target{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:12.5px;color:var(--ink-soft)}
.lib-target select{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-size:12.5px}
.lib-filters{padding:10px 16px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
.lib-filters input[type=search]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;background:#fbfcfa}
.fchips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{
  border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;color:var(--ink-soft);
}
.fchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.lib-list{overflow-y:auto;padding:6px 10px 12px;flex:1}
.card{
  border:1px solid var(--line-soft);border-radius:11px;padding:11px 12px;margin:7px 2px;background:#fff;
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;cursor:grab;
}
.card{cursor:pointer}
.card:hover{border-color:var(--tea);background:#fcfdfb}
.card:hover .add{background:var(--tea);border-color:var(--tea);color:#fff}
.card .cn{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:.01em}
.card .en{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.card .desc{font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.5}
.card .row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.card .price{font-family:var(--mono);font-size:11px;color:var(--tea)}
.add{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-size:17px;line-height:1;color:var(--tea)}
.add:hover{background:var(--tea);border-color:var(--tea);color:#fff}
.libcount{padding:8px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;border-top:1px solid var(--line-soft)}
.none{padding:26px 14px;text-align:center;color:var(--ink-faint);font-size:13px}

/* ---------- quick add palette ---------- */
.pal-backdrop{
  position:fixed;inset:0;background:rgba(22,33,30,.42);z-index:80;display:none;
  align-items:flex-start;justify-content:center;padding:8vh 16px 16px;
}
.pal-backdrop.on{display:flex}
.pal{
  background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(22,33,30,.28);
}
.pal-head{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.pal-head .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pal-head .to{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.pal-head select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;font-size:12.5px}
.pal-head input{
  width:100%;margin-top:10px;border:0;border-bottom:2px solid var(--tea);background:transparent;
  padding:6px 2px 8px;font-family:var(--serif);font-size:20px;
}
.pal-head input:focus{outline:none}
.pal-list{overflow-y:auto;padding:6px;flex:1}
.pal-row{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:9px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;
}
.pal-row .cn{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.01em}
.pal-row .en{font-size:12.5px;color:var(--ink-faint)}
.pal-row .side{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:right;white-space:nowrap}
.pal-row[aria-selected=true]{background:var(--tea-soft);border-color:#c6dbc9}
.pal-row.added{background:#f3f8f3}
.pal-row.added .side{color:var(--tea)}
.pal-row.own .cn{color:var(--tea)}
.pal-foot{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-top:1px solid var(--line-soft);background:#fbfcfa;
}
.pal-foot .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
.pal-foot kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fff;font-size:10px}
.pal-count{font-size:12.5px;color:var(--tea)}
.btn-add{background:var(--tea);border-color:var(--tea);color:#fff}
.btn-add:hover{background:#265a41;color:#fff}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;transition:.2s;z-index:60;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- mobile library toggle ---------- */
.libtoggle{display:none}
@media(max-width:1080px){
  .libtoggle{display:inline-block}
  .lib.hide{display:none}
}

@media print{
  .masthead .tools,.rail,.lib,.day-foot,.act-col,.libtoggle,.toast{display:none !important}
  body{background:#fff}
  .shell{display:block;padding:0;max-width:none}
  .day{border:0;border-top:1px solid #ccc;border-radius:0;margin:0;page-break-inside:avoid}
  .note,.fields input,.time-col input,.day-titles input,.title-line input,.stay-fields input{border-color:transparent !important;background:transparent !important}
  .stay{background:#f6f3ea !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-in">
    <div class="brand">
      <h1>Hangzhou<span class="sep">·</span>Shanghai</h1>
      <div class="sub">17 to 24 September 2026 · 8 days · Hangzhou to Shanghai</div>
    </div>
    <div class="tools">
      <button class="btn btn-add" id="btnQuick">+ Add place</button>
      <button class="btn libtoggle" id="btnLib">Browse places</button>
      <button class="btn" id="btnPlan">Suggested plan</button>
      <button class="btn" id="btnPrint">Print</button>
      <button class="btn btn-solid" id="btnSave">Download</button>
      <button class="btn btn-quiet" id="btnReset">Reset</button>
    </div>
  </div>
</header>

<main class="shell">
  <section>
    <nav class="rail" id="rail" aria-label="Jump to day"></nav>
    <div id="days"></div>
  </section>

  <aside class="lib hide" id="lib">
    <div class="lib-head">
      <h2>Places</h2>
      <p>Click a card to add it to the day below, or drag it onto any day.</p>
      <div class="lib-target"><label for="target">Add to</label><select id="target"></select></div>
    </div>
    <div class="lib-filters">
      <input type="search" id="q" placeholder="Search name, dish, area">
      <div class="fchips" id="cityChips"></div>
      <div class="fchips" id="kindChips"></div>
    </div>
    <div class="lib-list" id="libList"></div>
    <div class="libcount" id="libCount"></div>
  </aside>
</main>

<div class="pal-backdrop" id="pal">
  <div class="pal" role="dialog" aria-modal="true" aria-label="Add to the itinerary">
    <div class="pal-head">
      <div class="row">
        <span class="to">Adding to</span>
        <select id="palDay"></select>
      </div>
      <input id="palQ" placeholder="Type a place, dish or area" autocomplete="off">
    </div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot">
      <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> add · <kbd>Esc</kbd> close</span>
      <span class="pal-count" id="palCount"></span>
      <button class="btn" id="palDone">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ---------------- state ---------------- */
const KEY = 'hz-sh-planner-v1';
let uid = Date.now();
const nid = () => 'i' + (++uid).toString(36);
let state;

function seed(){
  return {days: DAYS_SEED.map(d => ({
    ...d,
    stay: {...(STAYS[d.date] || {name:'', book:'', note:''})},
    items: (FIXED[d.date]||[]).map(x => ({iid:nid(), note:'', ...x}))
  }))};
}
/* older saved trips kept the hotel as a timeline row, lift it into the night panel */
function migrate(s){
  s.days.forEach(d => {
    if(d.stay) return;
    const h = d.items.find(x => x.type === 'hotel');
    if(h){
      d.stay = {name: h.cn || h.title || '', book: (h.h && h.h.book) || '', note: h.note || ''};
      d.items = d.items.filter(x => x !== h);
    }else{
      d.stay = {...(STAYS[d.date] || {name:'', book:'', note:''})};
    }
  });
  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.days && s.days.length) return migrate(s); }
  }catch(e){}
  return seed();
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }, 220);
}
state = load();
const dayOf = id => state.days.find(d => d.date === id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- library ---------------- */
let filters = {q:'', city:'all', kind:'all'};
const CITIES = [['all','All'],['Hangzhou','Hangzhou'],['Shanghai','Shanghai']];
const KINDS  = [['all','Everything'],['food','Food'],['sight','Sights'],['fun','Fun'],['night','Night']];

function libMatches(){
  const q = filters.q.trim().toLowerCase();
  return LIB.filter(p => {
    if(filters.city !== 'all' && p.city !== filters.city) return false;
    if(filters.kind !== 'all' && p.kind !== filters.kind) return false;
    if(!q) return true;
    return [p.name,p.cn,p.cat,p.area,p.areaEn,p.desc,p.price,p.addr,(p.tags||[]).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });
}
function renderChips(){
  document.getElementById('cityChips').innerHTML = CITIES.map(([v,l]) =>
    `<button class="fchip" data-f="city" data-v="${v}" aria-pressed="${filters.city===v}">${l}</button>`).join('');
  document.getElementById('kindChips').innerHTML = KINDS.map(([v,l]) =>
    `<button class="fchip" data-f="kind" data-v="${v}" aria-pressed="${filters.kind===v}">${l}</button>`).join('');
}
function renderLib(){
  const list = libMatches();
  const el = document.getElementById('libList');
  el.innerHTML = list.length ? list.map(p => `
    <article class="card" draggable="true" data-lib="${p.id}">
      <div>
        <div class="cn">${esc(p.cn || p.name)}</div>
        <div class="en">${esc(p.name)}${p.cat?' · '+esc(p.cat):''}</div>
        <div class="desc">${esc(p.desc)}</div>
        <div class="row">
          <span class="chip ${p.kind}">${KIND[p.kind].cn} ${esc(p.area||p.city)}</span>
          ${p.price?`<span class="price">${esc(p.price)}</span>`:''}
        </div>
      </div>
      <button class="add" data-add="${p.id}" title="Add to the selected day" aria-label="Add ${esc(p.name)}">+</button>
    </article>`).join('')
    : `<div class="none">Nothing matches that. Try a shorter search.</div>`;
  document.getElementById('libCount').textContent = `${list.length} of ${LIB.length} places`;
}
function renderTarget(){
  const sel = document.getElementById('target');
  const cur = sel.value;
  sel.innerHTML = state.days.map(d =>
    `<option value="${d.date}">${fmtShort(d.date)} · ${esc(d.cn)}</option>`).join('');
  if(cur) sel.value = cur;
}

/* ---------------- helpers ---------------- */
function fmtShort(iso){ const [,m,d] = iso.split('-'); return `${+d}/${+m}`; }
function weekday(iso){ return WEEK[new Date(iso+'T00:00:00').getDay()]; }
function metaOf(p){
  return [p.area, p.addr, p.metro].filter(Boolean);
}
function itemFromLib(id, time){
  const p = LIB.find(x => x.id === id);
  if(!p) return null;
  return {iid:nid(), type:'place', ref:p.id, kind:p.kind, time:time||'',
          cn:p.cn||p.name, title:p.name, sub:[p.cat, ...metaOf(p)].filter(Boolean).join(' · '),
          price:p.price||'', note:''};
}

/* ---------------- day rendering ---------------- */
function itemHTML(it, di, idx, total){
  const kind = it.type === 'place' ? (it.kind||'sight') : it.type;
  const label = KIND[kind] || KIND.custom;
  let extra = '';
  if(it.type === 'flight'){
    const f = it.f || {};
    extra = `<div class="fields">
      <input data-fld="code" placeholder="Flight no" value="${esc(f.code)}" style="width:150px">
      <input data-fld="from" placeholder="From" value="${esc(f.from)}" style="width:100px">
      <input data-fld="to" placeholder="To" value="${esc(f.to)}" style="width:100px">
      <input data-fld="dep" placeholder="Dep" value="${esc(f.dep)}" style="width:88px">
      <input data-fld="arr" placeholder="Arr" value="${esc(f.arr)}" style="width:88px">
    </div>`;
  }
  if(it.type === 'hotel'){
    const h = it.h || {};
    extra = `<div class="fields">
      <input data-fld="book" placeholder="Booking reference or note" value="${esc(h.book)}" style="width:min(320px,100%)">
    </div>`;
  }
  const editableTitle = (it.type !== 'place');
  return `<div class="item" data-iid="${it.iid}" data-day="${di}">
    <div class="time-col"><input data-f="time" value="${esc(it.time)}" placeholder="Time" maxlength="7" aria-label="Time"></div>
    <div class="body-col">
      <div class="title-line">
        ${editableTitle
          ? `<input data-f="cn" value="${esc(it.cn)}" placeholder="Title">`
          : `<span class="cn">${esc(it.cn)}</span><span class="en">${esc(it.title)}</span>`}
      </div>
      ${editableTitle && it.title ? `<div class="meta">${esc(it.title)}</div>` : ''}
      ${it.type === 'place' ? `<div class="meta"><span class="chip ${kind}">${label.en}</span>${it.sub?`<span>${esc(it.sub)}</span>`:''}${it.price?`<span class="cost">${esc(it.price)}</span>`:''}</div>`
        : `<div class="meta"><span class="chip ${kind}">${label.en}</span></div>`}
      ${extra}
      <textarea class="note" data-f="note" rows="1" placeholder="Notes, bookings, who is coming">${esc(it.note)}</textarea>
    </div>
    <div class="act-col">
      <span class="grip" title="Drag to reorder">⠿</span>
      <button class="iconbtn" data-move="-1" ${idx===0?'disabled':''} aria-label="Move up">↑</button>
      <button class="iconbtn" data-move="1" ${idx===total-1?'disabled':''} aria-label="Move down">↓</button>
      <button class="iconbtn del" data-del="1" aria-label="Remove">✕</button>
    </div>
  </div>`;
}

function dayHTML(d, di){
  const items = d.items;
  const st = d.stay || {name:'',book:'',note:''};
  return `<section class="day${d.wedding?' wedding':''}" data-day="${di}" id="day-${d.date}">
    <div class="day-head">
      <div class="date-block">
        <div class="dm">${fmtShort(d.date)}</div>
        <div class="mo">${weekday(d.date).slice(0,3)}</div>
      </div>
      <div class="day-titles">
        <div class="cn">${esc(d.cn)}</div>
        <input data-f="title" value="${esc(d.title)}" placeholder="Day heading">
      </div>

    </div>
    <div class="items">
      ${items.length ? items.map((it,i)=>itemHTML(it,di,i,items.length)).join('')

    </div>

function renderRail(){
  document.getElementById('rail').innerHTML = state.days.map(d =>
    `<button data-jump="${d.date}" class="${d.wedding?'wed':''}"><b>${fmtShort(d.date)}</b><span>${esc(d.cn)}</span></button>`).join('');
}
function renderDays(){
  document.getElementById('days').innerHTML = state.days.map(dayHTML).join('');
  document.querySelectorAll('.note').forEach(grow);
}
function grow(t){ t.style.height='auto'; t.style.height = (t.scrollHeight+2)+'px'; }
function renderAll(){ renderRail(); renderDays(); renderTarget(); }

/* ---------------- mutations ---------------- */
function addToDay(date, item, at){
  const d = dayOf(date); if(!d || !item) return;
  if(at == null) d.items.push(item); else d.items.splice(at, 0, item);
  save(); renderDays();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1700);
}

/* ---------------- events: itinerary ---------------- */
const daysEl = document.getElementById('days');

daysEl.addEventListener('input', e => {
  const el = e.target;
  const dayEl = el.closest('.day'); if(!dayEl) return;
  const d = state.days[+dayEl.dataset.day];
  const itemEl = el.closest('.item');
  if(!itemEl){
    if(el.dataset.f === 'title'){ d.title = el.value; save(); }
    if(el.dataset.s){ (d.stay = d.stay || {}) [el.dataset.s] = el.value; save(); }
    return;
  }
  const it = d.items.find(x => x.iid === itemEl.dataset.iid); if(!it) return;
  if(el.dataset.f){ it[el.dataset.f] = el.value; if(el.dataset.f === 'note') grow(el); }
  if(el.dataset.fld){
    const bag = it.type === 'flight' ? (it.f = it.f||{}) : (it.h = it.h||{});
    bag[el.dataset.fld] = el.value;
  }
  save();
});

daysEl.addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn) return;
  const dayEl = btn.closest('.day'); const di = +dayEl.dataset.day; const d = state.days[di];
  const itemEl = btn.closest('.item');

  if(btn.dataset.del && itemEl){
    d.items = d.items.filter(x => x.iid !== itemEl.dataset.iid);
    save(); renderDays(); return;
  }
  if(btn.dataset.move && itemEl){
    const i = d.items.findIndex(x => x.iid === itemEl.dataset.iid);
    const j = i + (+btn.dataset.move);
    if(j < 0 || j >= d.items.length) return;
    [d.items[i], d.items[j]] = [d.items[j], d.items[i]];
    save(); renderDays(); return;
  }
  if(btn.dataset.addType){
    const t = btn.dataset.addType;
    const base = {iid:nid(), type:t, time:'', note:''};
    if(t === 'custom') Object.assign(base, {cn:'', title:''});
    if(t === 'flight') Object.assign(base, {cn:'', f:{code:'',from:'',to:'',dep:'',arr:''}});
    if(t === 'hotel')  Object.assign(base, {cn:'', h:{book:''}});
    d.items.push(base); save(); renderDays();
    const rows = document.querySelectorAll(`#day-${d.date} .item`);
    const last = rows[rows.length-1];
    const focus = last && (last.querySelector('input[data-f="cn"]') || last.querySelector('input[data-f="time"]'));
    if(focus) focus.focus();
    return;
  }
  if(btn.dataset.quick){ openPal(btn.dataset.quick); return; }
  if(btn.dataset.sort){
    const key = x => x.time && /^\d/.test(x.time) ? x.time.padStart(5,'0') : 'zz';
    d.items.sort((a,b) => key(a).localeCompare(key(b)));
    save(); renderDays(); toast('Sorted by time'); return;
  }
});

/* ---------------- drag and drop ---------------- */
let drag = null;

daysEl.addEventListener('mousedown', e => {
  const grip = e.target.closest('.grip');
  const item = e.target.closest('.item');
  if(grip && item) item.setAttribute('draggable','true');
});
daysEl.addEventListener('dragstart', e => {
  const item = e.target.closest('.item'); if(!item) return;
  drag = {mode:'move', day:+item.closest('.day').dataset.day, iid:item.dataset.iid};
  item.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', item.dataset.iid); }catch(err){}
});
daysEl.addEventListener('dragend', e => {
  const item = e.target.closest('.item');
  if(item){ item.classList.remove('dragging'); item.removeAttribute('draggable'); }
  clearMarks(); drag = null;
});

document.getElementById('libList').addEventListener('dragstart', e => {
  const card = e.target.closest('.card'); if(!card) return;
  drag = {mode:'lib', id:card.dataset.lib};
  e.dataTransfer.effectAllowed = 'copy';
  try{ e.dataTransfer.setData('text/plain', card.dataset.lib); }catch(err){}
});

function clearMarks(){
  document.querySelectorAll('.over-top,.over-bot').forEach(n => n.classList.remove('over-top','over-bot'));
  document.querySelectorAll('.day.drop').forEach(n => n.classList.remove('drop'));
}
function dropIndex(dayEl, y){
  const rows = [...dayEl.querySelectorAll('.item')];
  for(let i=0;i<rows.length;i++){
    const r = rows[i].getBoundingClientRect();
    if(y < r.top + r.height/2){ rows[i].classList.add('over-top'); return i; }
  }
  if(rows.length) rows[rows.length-1].classList.add('over-bot');
  return rows.length;
}
daysEl.addEventListener('dragover', e => {
  if(!drag) return;
  const dayEl = e.target.closest('.day'); if(!dayEl) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = drag.mode === 'lib' ? 'copy' : 'move';
  clearMarks(); dayEl.classList.add('drop');
  dayEl._idx = dropIndex(dayEl, e.clientY);
});
daysEl.addEventListener('drop', e => {
  if(!drag) return;
  const dayEl = e.target.closest('.day'); if(!dayEl) return;
  e.preventDefault();
  const target = state.days[+dayEl.dataset.day];
  let at = dayEl._idx == null ? target.items.length : dayEl._idx;

  if(drag.mode === 'lib'){
    const it = itemFromLib(drag.id);
    if(it){ target.items.splice(at, 0, it); toast('Added ' + it.cn); }
  }else{
    const src = state.days[drag.day];
    const i = src.items.findIndex(x => x.iid === drag.iid);
    if(i < 0) return;
    const [moved] = src.items.splice(i, 1);
    if(src === target && i < at) at--;
    target.items.splice(at, 0, moved);
  }
  clearMarks(); drag = null; save(); renderDays();
});

/* ---------------- events: library ---------------- */
document.getElementById('libList').addEventListener('click', e => {
  const card = e.target.closest('.card'); if(!card) return;
  const date = document.getElementById('target').value || state.days[0].date;
  const it = itemFromLib(card.dataset.lib);
  addToDay(date, it);
  toast(`Added ${it.cn} to ${fmtShort(date)}`);
});
document.getElementById('q').addEventListener('input', e => { filters.q = e.target.value; renderLib(); });
document.querySelectorAll('#cityChips, #kindChips').forEach(box => box.addEventListener('click', e => {
  const c = e.target.closest('.fchip'); if(!c) return;
  filters[c.dataset.f] = c.dataset.v; renderChips(); renderLib();
}));
document.getElementById('rail').addEventListener('click', e => {
  const b = e.target.closest('[data-jump]'); if(!b) return;
  document.getElementById('day-' + b.dataset.jump).scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('target').value = b.dataset.jump;
});
document.getElementById('btnLib').addEventListener('click', () => {
  const l = document.getElementById('lib');
  l.classList.toggle('hide');
  if(!l.classList.contains('hide')) l.scrollIntoView({behavior:'smooth'});
});


/* ---------------- quick add palette ---------------- */
const palEl   = document.getElementById('pal');
const palQEl  = document.getElementById('palQ');
const palLEl  = document.getElementById('palList');
const palDEl  = document.getElementById('palDay');
const palCEl  = document.getElementById('palCount');
let palRows = [], palSel = 0, palAdded = 0, palJust = new Set();

/* the city you are most likely reaching for on a given day */
const DAY_CITY = {
  '2026-09-17':'Hangzhou','2026-09-18':'Hangzhou','2026-09-19':'Hangzhou','2026-09-20':'Hangzhou',
  '2026-09-21':'Shanghai','2026-09-22':'Shanghai','2026-09-23':'Shanghai','2026-09-24':'Shanghai'
};

function openPal(date){
  palDEl.innerHTML = state.days.map(d =>
    `<option value="${d.date}">${fmtShort(d.date)} · ${esc(d.cn)}</option>`).join('');
  palDEl.value = date || state.days[0].date;
  palQEl.value = ''; palSel = 0; palAdded = 0; palJust = new Set();
  palCEl.textContent = '';
  palEl.classList.add('on');
  palRender();
  setTimeout(()=>palQEl.focus(), 30);
}
function closePal(){
  palEl.classList.remove('on');
  if(palAdded) toast(`Added ${palAdded} to ${fmtShort(palDEl.value)}`);
}
function palResults(){
  const q = palQEl.value.trim().toLowerCase();
  if(!q){
    const city = DAY_CITY[palDEl.value];
    return LIB.filter(p => p.city === city).slice(0, 60);
  }
  const hit = p => [p.name,p.cn,p.cat,p.area,p.areaEn,p.city,p.desc,(p.tags||[]).join(' ')]
    .join(' ').toLowerCase().includes(q);
  const starts = [], rest = [];
  LIB.filter(hit).forEach(p => {
    ((p.name+' '+p.cn).toLowerCase().startsWith(q) ? starts : rest).push(p);
  });
  return [...starts, ...rest].slice(0, 60);
}
function palRender(){
  palRows = palResults();
  const typed = palQEl.value.trim();
  const own = typed ? `<div class="pal-row own" data-own="1" aria-selected="${palSel===palRows.length}">
      <div><div class="cn">${esc(typed)}</div><div class="en">Add as your own item</div></div>
      <div class="side">Enter</div></div>` : '';
  palLEl.innerHTML = (palRows.length ? palRows.map((p,i) => `
    <div class="pal-row${palJust.has(p.id)?' added':''}" data-i="${i}" aria-selected="${i===palSel}">
      <div>
        <div class="cn">${esc(p.cn || p.name)}</div>
        <div class="en">${esc(p.name)}${p.cat?' · '+esc(p.cat):''}${p.area?' · '+esc(p.area):''}</div>
      </div>
      <div class="side">${palJust.has(p.id)?'Added':esc(p.price||KIND[p.kind].en)}</div>
    </div>`).join('') : (typed ? '' : '<div class="none">Nothing here yet.</div>')) + own;
  const sel = palLEl.querySelector('[aria-selected=true]');
  if(sel && sel.scrollIntoView) sel.scrollIntoView({block:'nearest'});
}
function palAdd(i){
  const date = palDEl.value;
  const typed = palQEl.value.trim();
  let it, name;
  if(i === palRows.length || (!palRows.length && typed)){
    if(!typed) return;
    it = {iid:nid(), type:'custom', time:'', cn:typed, title:'', note:''};
    name = typed;
    palQEl.value = '';
  }else{
    const p = palRows[i]; if(!p) return;
    it = itemFromLib(p.id); name = it.cn;
    palJust.add(p.id);
  }
  dayOf(date).items.push(it);
  palAdded++;
  palCEl.textContent = `${palAdded} added to ${fmtShort(date)}`;
  save(); renderDays(); palRender();
}
palQEl.addEventListener('input', () => { palSel = 0; palRender(); });
palDEl.addEventListener('change', () => { palJust = new Set(); palRender(); palQEl.focus(); });
palLEl.addEventListener('click', e => {
  const row = e.target.closest('.pal-row'); if(!row) return;
  palAdd(row.dataset.own ? palRows.length : +row.dataset.i);
  palQEl.focus();
});
document.getElementById('palDone').addEventListener('click', closePal);
palEl.addEventListener('mousedown', e => { if(e.target === palEl) closePal(); });
document.addEventListener('keydown', e => {
  if(!palEl.classList.contains('on')){
    if(e.key === 'a' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
      e.preventDefault();
      openPal(document.getElementById('target').value || state.days[0].date);
    }
    return;
  }
  const max = palRows.length + (palQEl.value.trim() ? 1 : 0) - 1;
  if(e.key === 'Escape'){ e.preventDefault(); closePal(); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); palSel = Math.min(palSel+1, max); palRender(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); palSel = Math.max(palSel-1, 0); palRender(); }
  else if(e.key === 'Enter'){ e.preventDefault(); palAdd(palSel); }
});

/* ---------------- toolbar ---------------- */
document.getElementById('btnPlan').addEventListener('click', () => {
  const already = state.days.some(d => d.items.some(x => x._plan));
  if(already && !confirm('The suggested plan is already loaded. Add it again?')) return;
  Object.entries(PLAN).forEach(([date, rows]) => {
    const d = dayOf(date); if(!d) return;
    rows.forEach(r => {
      let it = r.ref ? itemFromLib(r.ref, r.time) : null;
      if(it){ if(r.note) it.note = r.note; }
      else it = {iid:nid(), type:'custom', time:r.time||'', cn:r.cn||'', title:r.title||'', note:r.note||''};
      it._plan = true;
      d.items.push(it);
    });
    const key = x => x.time && /^\d/.test(x.time) ? x.time.padStart(5,'0') : 'zz';
    d.items.sort((a,b) => key(a).localeCompare(key(b)));
  });
  save(); renderDays();
  toast('Suggested plan loaded');
});
document.getElementById('btnQuick').addEventListener('click', () =>
  openPal(document.getElementById('target').value || state.days[0].date));
document.getElementById('btnPrint').addEventListener('click', () => window.print());
document.getElementById('btnReset').addEventListener('click', () => {
  if(!confirm('Clear everything and start from the bookings only?')) return;
  state = seed(); save(); renderAll(); toast('Reset to bookings');
});
document.getElementById('btnSave').addEventListener('click', () => {
  const blob = new Blob([exportHTML()], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hangzhou-shanghai-itinerary-final.html';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Saved a clean copy');
});

/* ---------------- export ---------------- */
function exportHTML(){
  const body = state.days.map(d => {
    const rows = d.items.map(it => {
      const kind = it.type === 'place' ? (it.kind||'sight') : it.type;
      const label = KIND[kind] || KIND.custom;
      let sub = '';
      if(it.type === 'place') sub = [it.sub, it.price].filter(Boolean).join(' · ');
      if(it.type === 'flight' && it.f) sub = [it.f.code, [it.f.from,it.f.to].filter(Boolean).join(' to '), [it.f.dep,it.f.arr].filter(Boolean).join(' / ')].filter(Boolean).join(' · ');
      if(it.type === 'hotel' && it.h) sub = it.h.book || '';
      return `<tr><td class="t">${esc(it.time)}</td><td>
        <div class="n"><span class="cn">${esc(it.cn||it.title)}</span>${it.cn&&it.title?` <span class="en">${esc(it.title)}</span>`:''} <span class="k ${kind}">${label.en}</span></div>
        ${sub?`<div class="s">${esc(sub)}</div>`:''}
        ${it.note?`<div class="no">${esc(it.note)}</div>`:''}
      </td></tr>`;
    }).join('');
    return `<section class="day">
      <header><div class="d">${fmtShort(d.date)}</div><div><h2>${esc(d.cn)}</h2><p>${esc(weekday(d.date))} · ${esc(d.title)}</p></div></header>
      ${rows ? `<table>${rows}</table>` : `<p class="none">No plans for this day.</p>`}
      ${(d.stay && d.stay.name) ? `<div class="stay"><span class="lbl">Tonight</span><span class="nm">${esc(d.stay.name)}</span>${d.stay.book?`<span class="bk">${esc(d.stay.book)}</span>`:''}${d.stay.note?`<div class="nt">${esc(d.stay.note)}</div>`:''}</div>` : ''}
    </section>`;
  }).join('');

  return `<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangzhou and Shanghai, 17 to 24 Sept 2026</title><style>
:root{--ink:#16211e;--soft:#5c6a61;--faint:#8b978d;--line:#dae0d5;--tea:#2f6b4f;--lacquer:#b4392c;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
--sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,monospace}
body{margin:0;background:#eef1ea;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:34px 22px 70px}
h1{font-family:var(--serif);font-size:36px;margin:0;font-weight:600}
h1 span{color:var(--tea)}
.sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:7px 0 26px}
.day{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;page-break-inside:avoid}
.day header{display:flex;gap:15px;align-items:center;padding:15px 18px;border-bottom:1px solid #e8ece4}
.day .d{font-family:var(--serif);font-size:25px;font-weight:600;min-width:56px;text-align:center}
.day h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:600}
.day p{margin:2px 0 0;font-size:13px;color:var(--soft)}
table{width:100%;border-collapse:collapse}
td{padding:11px 18px;border-bottom:1px dashed #e8ece4;vertical-align:top}
tr:last-child td{border-bottom:0}
td.t{width:66px;font-family:var(--mono);font-size:12.5px;color:var(--tea);white-space:nowrap}
.n .cn{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:.01em}
.n .en{font-size:13px;color:var(--soft)}
.k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;border:1px solid var(--line);border-radius:99px;padding:2px 7px;color:var(--faint);white-space:nowrap}
.s{font-size:12.5px;color:var(--faint);margin-top:3px}
.no{font-size:13px;color:var(--soft);margin-top:5px;white-space:pre-wrap}
.none{padding:16px 18px;color:var(--faint);font-size:13px;margin:0}
.stay{border-top:1px solid #e8ece4;background:#faf6ec;padding:11px 18px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.stay .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#9a7526}
.stay .nm{font-family:var(--serif);font-size:15.5px;font-weight:600}
.stay .bk{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.stay .nt{flex-basis:100%;font-size:12.5px;color:var(--soft)}
footer{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;text-align:center;margin-top:26px}
@media print{body{background:#fff}.wrap{padding:0}.day{border:0;border-top:1px solid #ccc;border-radius:0}}
</style></head><body><div class="wrap">
<h1>Hangzhou <span>·</span> Shanghai</h1>
<div class="sub">17 to 24 September 2026 · 8 days · Hangzhou to Shanghai</div>
${body}
<footer>Safe travels</footer>
</div></body></html>`;
}

/* ---------------- boot ---------------- */
renderChips(); renderLib(); renderAll();
if(window.innerWidth > 1080) document.getElementById('lib').classList.remove('hide');
</script>
</body></html>
