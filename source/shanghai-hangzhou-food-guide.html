var state = { city: 'shanghai', district: 'all' };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function applyTheme(t){
  var r = document.documentElement;
  r.style.setProperty('--accent', t.accent);
  r.style.setProperty('--accent-soft', t.accentSoft);
  r.style.setProperty('--accent2', t.accent2);
  r.style.setProperty('--accent2-soft', t.accent2Soft);
  r.style.setProperty('--bg', t.bg);
  r.style.setProperty('--grad2', t.grad);
}

function cardHtml(p){
  var badge = p.viral
    ? '<span class="viral-badge">' + esc(p.badge) + '</span>'
    : '<span class="plain-badge">' + esc(p.badge) + '</span>';
  var tags = p.tags.map(function(t,i){
    var bg = i === 0 ? 'var(--accent-soft)' : 'var(--accent2-soft)';
    return '<span class="tag" style="background:' + bg + '">' + esc(t) + '</span>';
  }).join('');
  return '<div class="food-card reveal rounded-2xl p-6" style="background:var(--card);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05)">'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">' + badge
    + '<span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">' + esc(p.cat) + '</span></div>'
    + '<h3 class="text-xl font-bold mb-1">' + esc(p.cn) + '<span class="en-name">' + esc(p.name) + '</span></h3>'
    + '<p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:12px">' + esc(p.desc) + '</p>'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">' + tags + '</div>'
    + '<div style="padding-top:10px;border-top:1px solid var(--border)">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
    + '<span style="font-size:12px;color:var(--muted)">' + esc(p.price) + '</span>'
    + '<span style="font-size:12px;color:var(--accent);font-weight:600;text-align:right">' + esc(p.addr) + '</span></div>'
    + '<div class="metro-info"><span class="metro-dot"></span><span>Nearest Metro: ' + esc(p.metro) + '</span></div>'
    + '</div></div>';
}

function render(){
  var city = DATA[state.city];
  applyTheme(city.theme);
  document.getElementById('kicker').textContent = city.kicker;
  document.getElementById('cityName').textContent = city.label;
  document.getElementById('intro').textContent = city.intro;

  document.querySelectorAll('.city-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-city') === state.city);
  });

  var tabs = ['<button class="tab-btn' + (state.district === 'all' ? ' active' : '') + '" data-d="all">全部<span class="tab-en">All Districts</span></button>'];
  city.districts.forEach(function(d){
    tabs.push('<button class="tab-btn' + (state.district === d.id ? ' active' : '') + '" data-d="' + d.id + '">' + esc(d.cnName) + '<span class="tab-en">' + esc(d.name) + '</span></button>');
  });
  var tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = tabs.join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ state.district = this.getAttribute('d') || this.getAttribute('data-d'); render(); });
  });

  var shown = city.districts.filter(function(d){ return state.district === 'all' || d.id === state.district; });
  var html = shown.map(function(d){
    return '<div class="mb-6"><h2 class="text-2xl font-bold mb-2">'
      + '<span style="display:inline-block;width:8px;height:24px;background:' + d.bar + ';border-radius:2px;margin-right:10px;vertical-align:middle"></span>'
      + esc(d.cnFull) + '<span class="head-en">' + esc(d.full) + '</span></h2>'
      + '<p style="color:var(--muted);font-size:14px;margin-left:18px">' + esc(d.blurb) + '</p></div>'
      + '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-12">'
      + d.places.map(cardHtml).join('') + '</div>';
  }).join('');
  document.getElementById('content').innerHTML = html;
}

document.querySelectorAll('.city-btn').forEach(function(b){
  b.addEventListener('click', function(){
    state.city = this.getAttribute('data-city');
    state.district = 'all';
    render();
  });
});

render();
</script>
